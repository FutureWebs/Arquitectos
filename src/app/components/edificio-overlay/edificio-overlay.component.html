<div class="overlay" [class.visible]="isVisible">
  <img [src]="floorData.planoFondoSvg" class="bg-img" alt="Plano del piso" />

  <svg class="interactive-svg" viewBox="0 0 1080 1920" preserveAspectRatio="none">

    @for (apto of floorData.apartamentos; track apto.id) {
      <path
        [attr.d]="apto.svgPathCode"
        [class]="'apto-path ' + apto.estado.toLowerCase()"
        (click)="apartmentSelected.emit(apto)"
      />
    }

    @for (apto of floorData.apartamentos; track apto.id) {
      @let coords = getCenterCoords(apto.id);

      <g [class]="'apto-badge ' + apto.estado.toLowerCase()"
         [attr.transform]="'translate(' + coords.x + ',' + coords.y + ')'">

        <rect class="badge-container-bg" x="-55" y="-35" width="130" height="70" rx="35" />
        <circle class="status-dot" cx="-22" cy="0" r="12" />

        <text class="badge-text" x="22" y="0" text-anchor="middle" dominant-baseline="central">
          {{ apto.id.split('-')[1] }}
        </text>
      </g>
    }
  </svg>

  <div class="floor-selector">

    <div class="floors-scroll">
      @for (piso of listaPisos; track piso.nivel) {
        <button
          class="floor-btn"
          [class.active]="piso.nivel === floorData.nivel"
          (click)="floorChanged.emit(piso)">
          {{ piso.nivel }}
        </button>
      }
    </div>
  </div>
</div>
