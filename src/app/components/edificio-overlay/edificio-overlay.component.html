<div class="overlay" [class.visible]="isVisible" #overlayContainer>
  <!-- Contenedor con ancho fijo idéntico al Canva (1920x1080) -->
  <div class="canvas-container" >
    <img [src]="floorData.planoFondoSvg" class="bg-img" alt="Plano del piso"  />

    <svg class="interactive-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">

      <!-- Polígonos interactivos (Paths SVG) -->
      @for (apto of floorData.apartamentos; track apto.id) {
        <path
          [attr.d]="apto.svgPathCode"
          [class]="'apto-path ' + apto.estado.toLowerCase()"
          (click)="apartmentSelected.emit(apto)"
        />
      }

      <!-- Badges estilo Píldora -->
      @for (apto of floorData.apartamentos; track apto.id; let idx = $index) {
        @if (apto.badgeCoords) {
          <g [class]="'apto-badge ' + apto.estado.toLowerCase()"
             [attr.transform]="'translate(' + apto.badgeCoords.x + ',' + apto.badgeCoords.y + ')'"
             (click)="apartmentSelected.emit(apto)">

            <rect class="badge-container-bg" x="-34" y="-15" width="68" height="30" rx="9" />
            <circle class="status-dot" cx="-15" cy="0" r="5" />
            <text class="badge-text" x="9" y="0" text-anchor="middle" dominant-baseline="central">
              {{ floorData.nombre }}-{{ letraDepto(idx) }}
            </text>
          </g>
        }
      }
    </svg>
  </div>
</div>

<!-- Selector de pisos lateral flotante FUERA del overlay para garantizar que siempre flote en la pantalla -->
<div class="floor-selector" [class.visible]="isVisible">
  <div class="floors-scroll">
    @for (piso of pisosInvertidosSinPrimero; track piso.nivel) {
      <button
        class="floor-btn"
        [class.active]="piso.nivel === floorData.nivel"
        (click)="floorChanged.emit(piso)">
        {{ piso.nombre }}
      </button>
    }
  </div>
</div>
