@if (isVisible) {
  <div class="gallery-overlay" [class.gallery-overlay--video]="modo === 'video'" role="dialog" aria-label="Galería de renders">

    @if (modo === 'imagen') {
      <img [src]="imagenActual"
           class="gallery-img"
           alt="Render del proyecto"
           (load)="cargando.set(false)"
           (error)="cargando.set(false)" />
    } @else {
      <video class="gallery-img"
             [src]="imagenActual"
             [muted]="true"
             autoplay controls playsinline
             (loadedmetadata)="cargando.set(false)"
             (error)="cargando.set(false)">
      </video>
    }

    @if (cargando()) {
      <div class="gallery-spinner"></div>
    }

    <button class="gallery-btn gallery-close" (click)="cerrar()" aria-label="Volver">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>

    @if (imagenes.length > 1) {
      <button class="gallery-btn gallery-prev" (click)="anterior()" aria-label="Imagen anterior">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <button class="gallery-btn gallery-next" (click)="siguiente()" aria-label="Imagen siguiente">
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <div class="gallery-counter">{{ indice + 1 }} / {{ imagenes.length }}</div>
    }
  </div>
}
