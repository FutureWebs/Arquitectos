<header class="top-bar-layout">

  <!-- Grupo Izquierda: Menú Hamburguesa + Botón Volver -->
  <div class="top-left-group">

    <!-- Botón Menú Hamburguesa -->
    @if (mostrarMenuBtn) {
      <button class="btn-glass"
              [disabled]="isBlocked"
              (click)="onMenuClick()"
              [attr.aria-label]="'aria_menu' | translate">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
    }

    <!-- Botón Volver (Condicional según el estado de la web) -->
    @if (mostrarBackBtn) {
      <button class="btn-glass"
              [disabled]="isBlocked"
              (click)="onBackClick()"
              [attr.aria-label]="'aria_back' | translate">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    }

  </div>

  <!-- Grupo Derecha: Galería + Ubicación + Pantalla Completa -->
  <div class="top-right-group">
    @if (mostrarActionBtns) {
      <button class="btn-glass"
              [disabled]="isBlocked"
              (click)="onGalleryClick()"
              aria-label="Galería">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
      </button>

      <a class="btn-glass"
         [href]="ubicacionUrl"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Ubicación">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </a>
    }
    @if (mostrarFullscreenBtn) {
      <button class="btn-glass"
              [disabled]="isBlocked"
              (click)="toggleFullscreen()"
              [attr.aria-label]="'aria_fullscreen' | translate">
        <!-- SVG dinámico para pantalla completa o salir -->
        @if (isFullscreen) {
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        }
      </button>
    }
  </div>

</header>
