<!-- Backdrop translúcido con transición de opacidad -->
<div class="sidenav-backdrop" [class.open]="isOpen" (click)="close()"></div>

<!-- Contenedor principal del Sidenav con transición de posición -->
<div class="sidenav-container" [class.open]="isOpen">

  <!-- Cabecera con Marca Oficial -->
  <div class="sidenav-header">
    <div class="brand-info">
      <!-- Icono de la estrella de los vientos -->
      <div class="brand-logo-icon">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
        </svg>
      </div>
      <h3 class="brand-title">CARDINALES</h3>
      <span class="brand-subtitle-pill">ALTO PANORAMA</span>
    </div>
    <button class="btn-close-glass" (click)="close()" aria-label="Cerrar menú">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Acceso rápido: Iniciar Sesión -->
  <a href="#" class="login-quick" (click)="goToLogin(); $event.preventDefault()">
    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
    </svg>
    <span>Iniciar Sesión</span>
  </a>

  <!-- Contenido -->
  <nav class="sidenav-content">
    <ul class="nav-links">
      <li><a href="#" (click)="close()"><span>Información</span></a></li>
      <li><a href="#" (click)="close()"><span>Plantas</span></a></li>
      <li><a href="#" (click)="close()"><span>Galería</span></a></li>
      <li><a href="#" (click)="close()"><span>Videos</span></a></li>
      <li><a href="#" (click)="close()"><span>Tour 360</span></a></li>
      <li><a [href]="ubicacionUrl" target="_blank" rel="noopener noreferrer"><span>Ubicación</span></a></li>
      <li><a href="#" (click)="close()"><span>Contacto</span></a></li>
    </ul>

    <div class="footer-section">
      <div class="divider"></div>
      <div class="social-section">
        <p class="social-title">Seguinos en redes</p>
        <div class="social-icons">
          <a href="#" target="_blank" class="social-btn">Instagram</a>
          <a href="#" target="_blank" class="social-btn">LinkedIn</a>
          <a href="#" target="_blank" class="social-btn">WhatsApp</a>
        </div>
      </div>
    </div>
  </nav>

</div>
