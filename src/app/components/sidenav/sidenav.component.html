<!-- Backdrop translúcido con transición de opacidad -->
<div class="sidenav-backdrop" [class.open]="isOpen" (click)="close()"></div>

<!-- Contenedor principal del Sidenav con transición de posición -->
<div class="sidenav-container" [class.open]="isOpen">

  <!-- Cabecera -->
  <div class="sidenav-header">
    <div class="brand-info">
      <span class="brand-subtitle">Navegación</span>
      <h3 class="brand-title">Menú Principal</h3>
    </div>
    <button class="btn-close-glass" (click)="close()" aria-label="Cerrar menú">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Contenido -->
  <nav class="sidenav-content">
    <ul class="nav-links">
      <li><a href="#" (click)="close()"><span>Inicio</span></a></li>
      <li><a href="#" (click)="close()"><span>Nuestros Proyectos</span></a></li>
      <li><a href="#" (click)="close()"><span>Sobre la Constructora</span></a></li>
      <li><a href="#" (click)="close()"><span>Contacto</span></a></li>
    </ul>

    <div class="footer-section">
      <div class="divider"></div>
      <div class="social-section">
        <p class="social-title">Seguinos en redes</p>
        <div class="social-icons">
          <a href="#" target="_blank" class="social-btn">Instagram</a>
          <a href="#" target="_blank" class="social-btn">LinkedIn</a>
          <a href="#" target="_blank" class="social-btn">WhatsApp</a>
        </div>
      </div>
    </div>
  </nav>

</div>
