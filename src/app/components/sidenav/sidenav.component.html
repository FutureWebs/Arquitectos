<!-- Backdrop translúcido con transición de opacidad -->
<div class="sidenav-backdrop" [class.open]="isOpen" (click)="close()"></div>

<!-- Panel deslizante (patrón del showroom) -->
<div class="sidenav-container" [class.open]="isOpen">

  <!-- Cabecera: proyecto + lugar -->
  <div class="sidenav-head">
    <p class="sidenav-project">CARDINALES</p>
    <p class="sidenav-place">Alto Panorama</p>
  </div>

  <!-- Navegación -->
  <nav class="sidenav-nav" aria-label="Menú de navegación">
    <ul class="sidenav-list">

      <li>
        <button type="button" class="nav-item" [class.current]="enInicio" (click)="onInicio()">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
            <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          <span class="nav-label">Inicio</span>
        </button>
      </li>

      <li>
        <button type="button" class="nav-item" [attr.aria-expanded]="galeriaOpen" (click)="galeriaOpen = !galeriaOpen">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
          </svg>
          <span class="nav-label">Galería</span>
          <svg class="nav-chevron" [class.flipped]="galeriaOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>
        @if (galeriaOpen) {
          <ul class="nav-children">
            <li>
              <button type="button" class="nav-child" (click)="onGaleria()">Imágenes</button>
            </li>
            <li>
              <button type="button" class="nav-child" (click)="onTour360()">Tour 360</button>
            </li>
          </ul>
        }
      </li>

      <li>
        <button type="button" class="nav-item" (click)="onVideos()">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="6 3 20 12 6 21 6 3"/>
          </svg>
          <span class="nav-label">Videos</span>
        </button>
      </li>

      <li>
        <button type="button" class="nav-item" (click)="close()">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
          <span class="nav-label">Información</span>
        </button>
      </li>

      <li>
        <a class="nav-item" [href]="ubicacionUrl" target="_blank" rel="noopener noreferrer">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span class="nav-label">Ubicación</span>
        </a>
      </li>

      <li>
        <button type="button" class="nav-item" (click)="close()">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <span class="nav-label">Contacto</span>
        </button>
      </li>

      <li>
        <button type="button" class="nav-item" (click)="goToLogin()">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <path d="m10 17 5-5-5-5"/>
            <path d="M15 12H3"/>
          </svg>
          <span class="nav-label">Iniciar Sesión</span>
        </button>
      </li>

    </ul>
  </nav>

  <!-- Pie con regla decorativa (patrón del showroom) -->
  <footer class="sidenav-foot">
    <span class="sidenav-rule" aria-hidden="true">✳</span>
    <p>© {{ anio }} FutureWebs</p>
  </footer>

</div>
