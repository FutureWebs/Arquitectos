name: Deploy GitHub Pages

# Genera el build de Angular y publica el resultado en la rama `deploys`.
# GitHub Pages debe estar configurado (una sola vez) con
# Settings → Pages → Source: "Deploy from a branch" → deploys / (root).

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Dos deploys seguidos no pueden pisarse entre sí.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # La base href se calcula con el nombre del repo para que funcione
        # en https://<usuario>.github.io/<nombre-del-repo>/
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Preparar sitio
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -r dist/torre/browser/. "$RUNNER_TEMP/site/"
          # .nojekyll: evita que Pages procese la rama con Jekyll (lo crea automáticamente)
          touch "$RUNNER_TEMP/site/.nojekyll"
          # 404.html: al recargar una ruta interna, GitHub Pages sirve este archivo y Angular sigue ruteando.
          cp "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/site/404.html"

      - name: Publicar en la rama deploys
        working-directory: ${{ runner.temp }}/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --initial-branch=deploys
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" deploys
