<div class="nav-controls">
  <app-icon-button
    variant="nav"
    icon="chevron_left"
    [label]="prevLabel"
    [disabled]="!canPrev"
    (pressed)="prev.emit()" />

  <app-icon-button
    variant="nav"
    icon="chevron_right"
    [label]="nextLabel"
    [disabled]="!canNext"
    (pressed)="next.emit()" />
</div>
