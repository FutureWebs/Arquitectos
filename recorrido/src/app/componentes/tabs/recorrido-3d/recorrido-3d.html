@if (tour3d(); as tour) {
  <div class="tour3d" #container>
    <iframe
      class="tour3d-iframe"
      [src]="safeUrl()"
      [attr.title]="tour.title ?? 'Recorrido 3D'"
      allowfullscreen></iframe>

    <app-icon-button
      class="fullscreen-btn"
      [icon]="isFullscreen() ? 'fullscreen_exit' : 'fullscreen'"
      [label]="fullscreenLabel()"
      (pressed)="toggleFullscreen()" />
  </div>
} @else {
  <div class="tour3d-empty">
    <span>{{ emptyLabel() }}</span>
  </div>
}
