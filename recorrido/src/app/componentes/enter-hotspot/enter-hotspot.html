<button
  type="button"
  class="enter-hotspot"
  [style.left.%]="position.x"
  [style.top.%]="position.y"
  [attr.aria-label]="buildingName ? label + ' ' + buildingName : label"
  (click)="entered.emit()">
  <span class="pulse" aria-hidden="true"></span>
  <span class="hotspot-label">{{ label }}</span>
</button>
