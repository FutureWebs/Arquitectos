<app-media-stage>
  @if (state.loading()) {
    <app-loading-screen [text]="labels.loading" />
  }

  @if (state.scene() === 'inicio' && !state.animating()) {
    <app-start-screen
      [heroText]="labels.hero"
      [startLabel]="labels.start"
      (started)="state.start()" />
  }

  @if (state.showBack()) {
    <div class="top-left">
      <app-icon-button
        variant="glass"
        icon="arrow_back"
        [label]="labels.back"
        (pressed)="state.back()" />
    </div>
  }

  <div class="top-right">
    <app-icon-button
      variant="glass"
      [icon]="isFullscreen() ? 'fullscreen_exit' : 'fullscreen'"
      [label]="isFullscreen() ? labels.exitFullscreen : labels.fullscreen"
      (pressed)="toggleFullscreen()" />
  </div>

  @if (state.scene() === 'exterior' && !state.animating()) {
    <app-stop-indicators
      [stops]="stopMarkers"
      [activeId]="state.stopId()"
      [label]="labels.stopIndicator" />

    <app-nav-controls
      [prevLabel]="labels.prevStop"
      [nextLabel]="labels.nextStop"
      [canPrev]="state.prevStop() !== null"
      [canNext]="state.nextStop() !== null"
      (prev)="state.rotate('prev')"
      (next)="state.rotate('next')" />
  }

  @for (hotspot of state.hotspots(); track hotspot.building.id) {
    <app-enter-hotspot
      [label]="labels.enter"
      [buildingName]="hotspot.building.name"
      [position]="hotspot.position"
      (entered)="state.enter(hotspot.building.id)" />
  }
</app-media-stage>

<app-info-modal
  [visible]="state.modalOpen()"
  [building]="state.activeBuilding()"
  [tabs]="tabs"
  [labels]="labels"
  (closed)="state.closeModal()" />
