<div class="start-screen">
  @if (heroText) {
    <p class="hero-text">{{ heroText }}</p>
  }

  <div class="start-action">
    <button type="button" class="btn-start" (click)="started.emit()">
      {{ startLabel }}
    </button>

    <button
      type="button"
      class="btn-components"
      [attr.title]="componentsLabel"
      (click)="componentsRequested.emit()">
      {{ componentsLabel }}
    </button>
  </div>
</div>
