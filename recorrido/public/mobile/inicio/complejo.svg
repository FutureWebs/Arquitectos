<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Plano ilustrado del complejo">
  <defs>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2a37"/>
      <stop offset="100%" stop-color="#151c26"/>
    </linearGradient>
    <linearGradient id="tejado" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="tejado2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#0b111a"/>

  <g filter="url(#sombra)">
    <rect x="70" y="60" width="1060" height="600" rx="46" fill="url(#suelo)" stroke="#2c3a4b" stroke-width="3"/>
    <rect x="98" y="88" width="1004" height="544" rx="34" fill="none" stroke="#33445a" stroke-width="2" stroke-dasharray="14 12"/>
  </g>

  <!-- caminos -->
  <path d="M600 632 L600 470 L300 470 L300 300 L600 300 L600 132"
        fill="none" stroke="#2f3f52" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 300 L900 300 L900 470 L600 470"
        fill="none" stroke="#2f3f52" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 632 L600 470 L300 470 L300 300 L600 300 L600 132"
        fill="none" stroke="#3d5168" stroke-width="3" stroke-dasharray="10 14" stroke-linecap="round"/>

  <!-- edificio principal -->
  <g filter="url(#sombra)">
    <rect x="470" y="230" width="260" height="150" rx="18" fill="#1b2634" stroke="#41546b" stroke-width="3"/>
    <path d="M452 244 L600 172 L748 244 Z" fill="url(#tejado2)"/>
    <rect x="508" y="272" width="54" height="54" rx="8" fill="#0e1721"/>
    <rect x="638" y="272" width="54" height="54" rx="8" fill="#0e1721"/>
    <rect x="574" y="330" width="52" height="50" rx="6" fill="#f8fafc"/>
  </g>

  <!-- cabañas -->
  <g filter="url(#sombra)">
    <rect x="196" y="366" width="150" height="96" rx="14" fill="#1b2634" stroke="#41546b" stroke-width="3"/>
    <path d="M182 378 L271 322 L360 378 Z" fill="url(#tejado)"/>
    <rect x="236" y="398" width="40" height="40" rx="6" fill="#0e1721"/>
    <rect x="298" y="418" width="34" height="44" rx="6" fill="#f8fafc"/>
  </g>

  <g filter="url(#sombra)">
    <rect x="846" y="366" width="150" height="96" rx="14" fill="#1b2634" stroke="#41546b" stroke-width="3"/>
    <path d="M832 378 L921 322 L1010 378 Z" fill="url(#tejado)"/>
    <rect x="886" y="398" width="40" height="40" rx="6" fill="#0e1721"/>
    <rect x="948" y="418" width="34" height="44" rx="6" fill="#f8fafc"/>
  </g>

  <g filter="url(#sombra)">
    <rect x="516" y="500" width="168" height="104" rx="14" fill="#1b2634" stroke="#41546b" stroke-width="3"/>
    <path d="M500 512 L600 452 L700 512 Z" fill="url(#tejado)"/>
    <rect x="556" y="536" width="44" height="44" rx="6" fill="#0e1721"/>
    <rect x="614" y="536" width="44" height="44" rx="6" fill="#0e1721"/>
    <rect x="586" y="594" width="46" height="42" rx="6" fill="#f8fafc"/>
  </g>

  <!-- arboleda -->
  <g fill="#2f6f4f">
    <circle cx="168" cy="168" r="30"/><circle cx="214" cy="196" r="22"/>
    <circle cx="1032" cy="168" r="30"/><circle cx="986" cy="196" r="22"/>
    <circle cx="168" cy="556" r="26"/><circle cx="1032" cy="556" r="26"/>
    <circle cx="404" cy="152" r="20"/><circle cx="796" cy="152" r="20"/>
  </g>
  <g fill="#1f4f3a">
    <circle cx="168" cy="168" r="14"/><circle cx="1032" cy="168" r="14"/>
    <circle cx="168" cy="556" r="12"/><circle cx="1032" cy="556" r="12"/>
  </g>

  <!-- estacionamiento -->
  <g stroke="#3d5168" stroke-width="3" fill="none">
    <rect x="906" y="540" width="140" height="76" rx="10"/>
    <path d="M941 540 L941 616 M976 540 L976 616 M1011 540 L1011 616"/>
  </g>

  <!-- marcas de parada -->
  <g font-family="Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <g><circle cx="600" cy="132" r="26" fill="#f8fafc"/><text x="600" y="140" fill="#0f172a">A</text></g>
    <g><circle cx="900" cy="470" r="26" fill="#f8fafc"/><text x="900" y="478" fill="#0f172a">B</text></g>
    <g><circle cx="300" cy="470" r="26" fill="#f8fafc"/><text x="300" y="478" fill="#0f172a">C</text></g>
  </g>
</svg>
